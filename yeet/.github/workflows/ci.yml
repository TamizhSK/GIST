name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The joke that is also the test strategy: we use real GitHub Actions
    # to prove our GitHub Actions clone works on all three platforms.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # These five are exactly `make check`. Keep them in sync — the point is
      # that a green local run means a green PR.
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: lint-imports
      - run: mypy src
      - run: pytest -m "not docker" --cov=yeet
