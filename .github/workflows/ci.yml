name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The joke that is also the test strategy: we use real GitHub Actions
    # to prove our GitHub Actions clone works on all three platforms.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # These are exactly `make check`. Keep them in sync — the point is that a
      # green local run means a green PR. `ruff format --check` and the print
      # guard were in CI-or-Makefile but never both, which is how main ended up
      # red twice with everyone believing they had run the gate.
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: lint-imports
      - run: mypy src
      - run: python tools/check_no_print.py src
      - run: pytest -m "not docker" --cov=yeet

  rules-doc:
    # docs/rules.md is generated from core/codes.py. Regenerate and diff, so a
    # new code without `make rules` is a red build instead of a doc that quietly
    # disagrees with what `yeet explain` prints.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python tools/gen_rules_doc.py
      - name: docs/rules.md is up to date
        run: git diff --exit-code -- docs/rules.md

  windows-console:
    # The one thing a Mac or a Linux box cannot exercise. `tests/unit/
    # test_console_encoding.py` builds real cp1252 streams and is the identical
    # encoder Windows uses, so it runs everywhere in `make check` — but the
    # Windows CONSOLE is a different subsystem. Modern Python writes to a real
    # console through WriteConsoleW and bypasses the codepage entirely, so the
    # two cases where a codepage still decides are REDIRECTED output and
    # `PYTHONLEGACYWINDOWSSTDIO`. Both are below. This existed as a line in
    # undone.md saying Windows was "verified by CI only", which was true of the
    # test suite and had never been true of the console.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: the encoding tests, on Windows
        run: pytest tests/unit/test_console_encoding.py tests/unit/test_ascii_output.py -q

      - name: redirected output under the ANSI codepage
        shell: cmd
        # `chcp 1252` sets the console codepage; the redirect is what makes it
        # apply. PYTHONUTF8=0 keeps PEP 540 from quietly making this a UTF-8
        # run and testing nothing at all.
        env:
          PYTHONUTF8: "0"
        run: |
          chcp 1252
          yeet --help > out.txt 2>&1 || exit /b 1
          yeet explain YEET-W402 >> out.txt 2>&1 || exit /b 1
          yeet check sample_project >> out.txt 2>&1
          findstr /C:"UnicodeEncodeError" out.txt && exit /b 1
          findstr /C:"Traceback" out.txt && exit /b 1
          exit /b 0

      - name: the legacy console, codepage and all
        shell: cmd
        # PYTHONLEGACYWINDOWSSTDIO puts stdout back on the codepage even when
        # it IS a real console — the configuration where a box character is a
        # hard error rather than a font question.
        env:
          PYTHONUTF8: "0"
          PYTHONLEGACYWINDOWSSTDIO: "1"
        run: |
          chcp 437
          yeet --help > legacy.txt 2>&1 || exit /b 1
          yeet check sample_project >> legacy.txt 2>&1
          findstr /C:"UnicodeEncodeError" legacy.txt && exit /b 1
          exit /b 0

  docker:
    # The 18 container tests never ran in CI, so a regression in
    # docker_backend.py — the highest-risk file in the repo — landed green.
    # ubuntu-latest ships a working daemon, so this costs a couple of minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: build the base image jobs run in
        run: docker build -f Dockerfile.base -t yeet/ubuntu:22.04 .
      - run: pytest -m docker -q
