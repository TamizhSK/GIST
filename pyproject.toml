[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yeet"
# Single-sourced from `src/yeet/__init__.py`. It was declared in both places,
# which is one release away from a wheel whose `--version` disagrees with its
# filename.
dynamic = ["version"]
description = "A local GitHub Actions-compatible runner with a dialect of its own"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "The yeet contributors" }]
keywords = ["github-actions", "ci", "workflow", "docker", "local", "runner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
# 3.10, not 3.11, because that is what Ubuntu 22.04 LTS ships — and therefore
# what a great many WSL installs have by default. Requiring 3.11 meant the
# single most common Linux-on-Windows environment could not install the tool
# without first building a Python. 3.10 is supported upstream until Oct 2026;
# macOS's system 3.9 is deliberately still out of scope (EOL, and it predates
# too much of the typing we use).
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "ruamel.yaml>=0.18",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "docker>=7.1",
    "watchdog>=4.0",
    "platformdirs>=4.2",
    "pathspec>=0.12",
    "cryptography>=42.0",
    "jinja2>=3.1",
    # `tomllib` became stdlib in 3.11; on 3.10 this is the same library under
    # its original name. analyzer/fingerprint.py imports one or the other.
    'tomli>=2.0; python_version < "3.11"',
]

[project.urls]
Homepage = "https://github.com/TamizhSK/GIST"
Repository = "https://github.com/TamizhSK/GIST"
Issues = "https://github.com/TamizhSK/GIST/issues"
Changelog = "https://github.com/TamizhSK/GIST/releases"

[project.optional-dependencies]
# `yeet run --tui`. Optional on purpose: a workflow runner that will not start
# because a display library is missing has failed at its actual job, so the
# CLI falls back to the streaming renderer with a line saying why.
tui = ["textual>=0.80"]
dev = [
    "textual>=0.80",
    "pytest-asyncio>=0.23",
    "pytest>=8.2",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

[project.scripts]
yeet = "yeet.cli.app:main"

[tool.hatch.version]
path = "src/yeet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yeet"]

# Two repo-root files are needed at RUN time, not just in a checkout.
# Force-included rather than copied into src/, so there is exactly one of each
# and `make image` and an installed `yeet run` build the same base image.
[tool.hatch.build.targets.wheel.force-include]
"Dockerfile.base" = "yeet/_data/Dockerfile.base"
"docs/rules.md" = "yeet/_data/rules.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The dashboard tests drive Textual's own async harness.
asyncio_mode = "auto"
markers = [
    "docker: needs a running Docker daemon",
    "slow: takes more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# These ship no type stubs. Without this block, `strict = true` fails the build
# the moment Dev C writes `import docker` — which is Day 2, not Day 5.
[[tool.mypy.overrides]]
module = [
    "tomli",
    "docker.*",
    "watchdog.*",
    "ruamel.*",
    "pathspec.*",
    "keyring.*",
    "typer.*",
    "jsonschema.*",
]
ignore_missing_imports = true

# --- Architecture enforcement: the tier rule from docs/architecture.md -------
# Run with:  lint-imports
[tool.importlinter]
root_package = "yeet"

[[tool.importlinter.contracts]]
name = "Layered architecture (a module may only import from lower tiers)"
type = "layers"
# `|` between siblings means INDEPENDENT: they may not import each other.
# That is deliberate and it is verified — see docs/adr/0007. Consequences:
#   * executor must not import secrets  -> use core.masking.Masker
#   * executor must not import storage  -> use core.events.LogSink
#   * actions therefore cannot sit at tier 5 (the executor consumes it), so it
#     sits at tier 2 next to parser: it RESOLVES a `uses:` into IR and executes
#     nothing.
layers = [
    "yeet.cli",
    "yeet.triggers",
    "yeet.executor | yeet.storage | yeet.secrets",
    "yeet.planner",
    "yeet.validation",
    "yeet.parser | yeet.analyzer | yeet.actions",
    "yeet.expressions | yeet.reporting",
    "yeet.core",
]

[[tool.importlinter.contracts]]
name = "core is a leaf — it imports nothing from us"
type = "forbidden"
source_modules = ["yeet.core"]
forbidden_modules = [
    "yeet.cli", "yeet.analyzer", "yeet.parser", "yeet.validation",
    "yeet.expressions", "yeet.planner", "yeet.executor", "yeet.actions",
    "yeet.reporting", "yeet.secrets", "yeet.storage", "yeet.triggers",
]
